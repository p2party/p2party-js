name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: "true"

      - name: Fetch the exact libsodium release object
        run: git -C libsodium fetch --depth=1 origin 2ce4d906a68eae82b27b4867f3d4172ec508cb27

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 6.0.3
          actions-cache-folder: emsdk-cache
          update: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.11.1"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Verify toolchain
        run: |
          test "$(npm --version)" = "11.6.2"
          test "$(bun --version)" = "1.3.14"
          emcc --version

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate the release tarball
        run: npm run release:pack

      - name: Verify generated crypto sources are reproducible
        run: git diff --exit-code -- src/cryptography/libcrypto.js src/cryptography/libcrypto.d.ts src/cryptography/libcrypto.provenance.json src/cryptography/wasmLoader.ts

      - name: Verify source and standalone API
        run: npm run check
