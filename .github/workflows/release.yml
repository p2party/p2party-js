name: tagged-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagged-release:
    name: Tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_DATE_EPOCH: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: "true"

      - name: Fetch the exact libsodium release object
        run: git -C libsodium fetch --depth=1 origin 2ce4d906a68eae82b27b4867f3d4172ec508cb27

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache
          update: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.11.1"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Verify tag and toolchain
        run: |
          test "$(npm --version)" = "11.6.2"
          test "$(bun --version)" = "1.3.14"
          emcc --version
          node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('tag ' + process.env.GITHUB_REF_NAME + ' does not match ' + expected)"

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate the release tarball
        run: npm run release:pack

      - name: Verify generated crypto sources are reproducible
        run: git diff --exit-code -- src/cryptography/libcrypto.js src/cryptography/libcrypto.d.ts src/cryptography/libcrypto.provenance.json src/cryptography/wasmLoader.ts

      - name: Verify source and standalone API
        run: npm run check

      # release:pack stages the production build into a temp tree and never
      # populates ./lib, but uploadcdn reads lib/index.min.js, lib/db.worker.js,
      # and lib/libcrypto.wasm. Unpack the tarball that was just validated
      # rather than rebuilding: the browser fetches the CDN WASM under a
      # build-pinned SRI, so CDN bytes that differ from the published bytes
      # would fail integrity on every load.
      - name: Stage the validated tarball for CDN upload
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          rm -rf .release-stage && mkdir -p .release-stage lib
          tar -xzf "p2party-${version}.tgz" -C .release-stage
          for asset in index.min.js db.worker.js libcrypto.wasm libcrypto.provenance.json; do
            cp ".release-stage/package/lib/${asset}" "lib/${asset}"
          done

      - name: Publish immutable CDN assets
        run: npm run uploadcdn
        env:
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          AWS_S3_FORCE_PATH_STYLE: ${{ secrets.AWS_S3_FORCE_PATH_STYLE }}

      - name: Verify public CDN WASM bytes and integrity
        run: npm run verify:cdn

      - name: Publish validated tarball to npm
        run: npm publish "p2party-$(node -p "require('./package.json').version").tgz" --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
