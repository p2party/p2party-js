<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>p2party — two browsers, one message</title>
    <style>
      body { font: 14px/1.5 ui-monospace, monospace; margin: 2rem auto; max-width: 46rem; }
      #invite { width: 100%; }
      #log p { margin: 0.25rem 0; }
      .sent { color: #666; }
    </style>
  </head>
  <body>
    <h1>p2party</h1>
    <p>
      Open this page, copy the invite, and paste it after <code>#</code> in a
      second tab's URL. The two tabs connect directly; the signaling service
      only introduces them.
    </p>
    <input id="invite" readonly />
    <p id="status">starting…</p>
    <form id="send"><input id="text" placeholder="message" autocomplete="off" /><button>send</button></form>
    <div id="log"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
