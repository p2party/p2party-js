name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Fetch the exact libsodium release object
        run: git -C libsodium fetch --depth=1 origin 05de1ce8088d4281a6264800070baf4ddf17b6a4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache
          update: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Install pinned npm
        run: npm install --global npm@12.2.3

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v26.13.1"
          test "$(npm --version)" = "12.2.3"
          test "$(bun --version)" = "1.4.5"
          emcc --version

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate the release tarball
        run: npm run release:pack

      - name: Retain the validated tarball for release comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: p2party-*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated crypto sources are reproducible
        run: git diff --exit-code -- src/cryptography/libcrypto.js src/cryptography/libcrypto.d.ts src/cryptography/libcrypto.provenance.json src/cryptography/wasmLoader.ts

      - name: Verify source and standalone API
        run: npm run check
